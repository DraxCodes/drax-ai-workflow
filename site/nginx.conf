server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/json application/javascript image/svg+xml text/plain;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|json|png|jpg|jpeg|webp|svg|woff2)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}